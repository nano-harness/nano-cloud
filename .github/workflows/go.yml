name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nano-cloud
      # go.mod uses `replace github.com/nano-harness/nano-agent => ../nano-agent`
      - uses: actions/checkout@v4
        with:
          repository: nano-harness/nano-agent
          path: nano-agent
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        working-directory: nano-cloud
        # cmd/runtime-nano-agent is excluded: it tracks an older nano-agent API (known drift, TODO)
        run: go build $(go list ./... | grep -v cmd/runtime-nano-agent)
      - name: Run tests
        working-directory: nano-cloud
        run: go test ./pkg/...
