name: MegaLinter

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout nano-agent
        uses: actions/checkout@v4
        with:
          repository: nano-harness/nano-agent
          path: .deps/nano-agent
          token: ${{ secrets.PAT_TOKEN }}

      - name: Rewrite go.mod replace path for CI
        run: sed -i 's|=> ../nano-agent|=> ./.deps/nano-agent|' go.mod

      # Authenticate with Docker Hub to avoid anonymous pull rate limits.
      # Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets in repo settings.
      # See: https://docs.docker.com/docker-hub/download-rate-limit/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/go@v8
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: auto
