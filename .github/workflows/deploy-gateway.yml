name: Deploy Nano Cloud Gateway

on:
  push:
    branches: [main]
    paths:
      - 'cmd/gateway/**'
      - 'cmd/worker/**'
      - 'cmd/runtime-*/**'
      - 'pkg/**'
      - 'proto/**'
      - 'docs/**'
      - 'deployment/deploy-gateway.sh'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/nano_deploy_key
          chmod 600 ~/.ssh/nano_deploy_key
      - name: Mask secrets
        env:
          NANO_GATEWAY_TOKEN: ${{ secrets.NANO_GATEWAY_TOKEN }}
        run: |
          if [ -n "$NANO_GATEWAY_TOKEN" ]; then
            echo "::add-mask::$NANO_GATEWAY_TOKEN"
          fi
      - name: Deploy Gateway
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          PEM_FILE: ~/.ssh/nano_deploy_key
          DEPLOY_DIR: /opt/nano-gateway
          LOCAL_PROJECT_DIR: ${{ github.workspace }}
          GATEWAY_TOKEN: ${{ secrets.NANO_GATEWAY_TOKEN || 'nano-gateway-token-2024' }}
          GATEWAY_LOG_FILE: /opt/nano-gateway/logs/gateway.log
        run: |
          chmod +x deployment/deploy-gateway.sh
          bash deployment/deploy-gateway.sh deploy
